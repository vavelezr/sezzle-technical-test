server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (locations below do not use add_header, so these apply everywhere).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin API: the browser calls /api/... and nginx forwards it to the
    # backend service, so no CORS is needed in the containerised setup.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html, which is never cached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
