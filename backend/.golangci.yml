version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - ineffassign
    - unused
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
        - name: blank-imports

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - sezzle-calculator/backend
